# =====================================================================
# MonCheptel API — configuration commune
#
# Aucun secret ici. Le depot est partage ; tout ce qui doit rester secret
# passe par une variable d'environnement, sans valeur par defaut. Une
# valeur par defaut pour un secret finit toujours en production.
# =====================================================================

spring:
  application:
    name: moncheptel-api

  datasource:
    url: ${MONCHEPTEL_DB_URL:jdbc:mysql://localhost:3306/moncheptel?useUnicode=true&characterEncoding=utf8&serverTimezone=Africa/Bamako}
    username: ${MONCHEPTEL_DB_USER:moncheptel}
    password: ${MONCHEPTEL_DB_PASSWORD}
    hikari:
      # 10 connexions : au-dela, MySQL passe plus de temps a arbitrer qu'a
      # repondre. Ce n'est pas un reglage a monter « au cas ou ».
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      # JAMAIS `update`. Flyway seul cree et fait evoluer le schema ;
      # `validate` verifie au demarrage que les entites correspondent, et
      # fait echouer le lancement sinon — avec un message precis, plutot
      # qu'une colonne ajoutee en silence et differemment sur chaque poste.
      ddl-auto: validate
    # Desactive : sans cela, la session Hibernate reste ouverte pendant tout
    # le rendu de la reponse, et une association paresseuse se charge depuis
    # le controleur sans qu'on s'en apercoive — jusqu'a ce qu'un ecran fasse
    # cent requetes. Le prix a payer est de declarer explicitement ce qu'on
    # charge ; c'est le but.
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
        # Charge les associations paresseuses par paquets de 25 au lieu d'une
        # requete par entite. Indispensable au tableau des utilisateurs de
        # l'administration : il pagine, donc il ne peut pas utiliser
        # `join fetch` — Hibernate paginerait alors en memoire sur les mille
        # deux cents comptes. Sans ce reglage, une page de vingt lignes
        # declencherait vingt chargements de zone et vingt de filieres.
        #
        # Ce reglage ne change JAMAIS un resultat : il ne fait que regrouper
        # des chargements qui auraient eu lieu de toute facon.
        default_batch_fetch_size: 25
        # Chaque requete est ecrite dans le code. `show_sql` en production
        # noierait les journaux ; il est active dans le profil dev.
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Refuse de demarrer si une migration deja appliquee a ete modifiee.
    validate-on-migrate: true
    # `baseline-on-migrate` reste a false : sur une base vide, Flyway part
    # de V1. L'activer permettrait de demarrer sur une base au schema
    # inconnu, ce qui est exactement ce qu'on veut interdire.
    baseline-on-migrate: false

  mail:
    host: ${MONCHEPTEL_SMTP_HOTE:smtp.gmail.com}
    port: ${MONCHEPTEL_SMTP_PORT:587}
    username: ${MONCHEPTEL_SMTP_USER:}
    password: ${MONCHEPTEL_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      # ── Delais d'attente, en millisecondes ──────────────────────────
      #
      # SANS CES TROIS LIGNES, UN SERVEUR SMTP QUI NE REPOND PAS BLOQUE
      # LA REQUETE INDEFINIMENT. JavaMail n'a aucun delai par defaut.
      #
      # Ce n'est pas une gene passagere : l'envoi se fait a l'interieur
      # d'une methode transactionnelle, donc le fil d'execution garde sa
      # connexion a la base pendant toute l'attente. Le pool en compte
      # dix (`maximum-pool-size`). Dix eleveurs demandant un code
      # pendant une panne du serveur de courriel suffisent a bloquer
      # TOUTE l'application, y compris les ecrans qui n'envoient rien.
      #
      # Dix secondes : au-dela, l'envoi a echoue. L'exception est
      # rattrapee et journalisee, l'utilisateur peut redemander, et la
      # connexion repart dans le pool.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jackson:
    default-property-inclusion: non_null
    # Les dates sortent en ISO-8601 ("2026-09-28", "2026-09-28T14:30:00Z"),
    # pas en nombre de millisecondes : Flutter et Angular les lisent tels
    # quels, et un journal reste relisible.
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  # Derriere le proxy HTTPS (exemple dans back/api/exploitation/), Tomcat
  # reprend l'adresse du client et le schema depuis X-Forwarded-For et
  # X-Forwarded-Proto, mais SEULEMENT si la requete vient d'un proxy du
  # reseau interne (127.0.0.1, 10.x, 192.168.x...). Un client direct ne peut
  # donc pas inventer son adresse : la limitation de debit et la liste des
  # sessions s'appuient dessus.
  forward-headers-strategy: native
  error:
    # La trace ne quitte jamais le serveur : elle nomme les classes, les
    # tables et parfois les valeurs. C'est GestionnaireExceptions qui
    # redige ce que l'utilisateur voit.
    include-stacktrace: never
    include-message: never

moncheptel:
  securite:
    # Obligatoire, sans valeur par defaut : l'application refuse de demarrer
    # sans. Au moins 32 octets — HMAC-SHA256 exige 256 bits.
    secret-jwt: ${MONCHEPTEL_JWT_SECRET}
    duree-jeton-minutes: 60
    duree-rafraichissement-jours: 30
    tentatives-avant-verrouillage: 5
    # Plafond du verrou PROGRESSIF : 1 min au 5e echec, puis 2, 4, 8, 15.
    # Il ne bloque que les nouvelles connexions par mot de passe ; les
    # sessions ouvertes continuent.
    duree-verrouillage-minutes: 15
  limite-debit:
    # Limitation par adresse IP des routes publiques d'authentification
    # (FiltreLimiteDebit). A laisser active ; le proxy ajoute la sienne.
    actif: ${MONCHEPTEL_LIMITE_DEBIT:true}
  administrateur-initial:
    # Premier administrateur, cree au demarrage SEULEMENT si la base n'en a
    # aucun (InitialisationAdministrateur). Sans valeur par defaut : rien
    # n'est cree tant que les deux variables ne sont pas definies. Le mot de
    # passe est provisoire, a changer a la premiere connexion.
    email: ${MONCHEPTEL_ADMIN_EMAIL:}
    mot-de-passe: ${MONCHEPTEL_ADMIN_MOT_DE_PASSE_INITIAL:}
    nom: ${MONCHEPTEL_ADMIN_NOM:Administrateur}
  orientation:
    # Delai de reponse d'un veterinaire a qui un cas est confie (V14). Passe
    # ce delai il recoit un rappel ; au double, l'eleveur est invite a
    # changer de veterinaire et l'administration prevenue d'un cas grave.
    # Format ISO-8601 : PT2H = 2 heures, PT30M = 30 minutes.
    delai-urgent: ${MONCHEPTEL_DELAI_REPONSE_URGENT:PT2H}
    delai-normal: ${MONCHEPTEL_DELAI_REPONSE_NORMAL:PT12H}
  firebase:
    # Vide : l'application demarre sans Firebase, les notifications sont
    # enregistrees sans etre poussees.
    fichier-cle: ${MONCHEPTEL_FIREBASE_CLE:}
  courriel:
    expediteur: ${MONCHEPTEL_COURRIEL_EXPEDITEUR:no-reply@moncheptel.ml}
  journaux:
    # Dossier des journaux tournants hors profil dev (logback-spring.xml).
    dossier: ${MONCHEPTEL_JOURNAUX:journaux}
  cors:
    # Adresses de la console d'administration autorisees a appeler l'API,
    # separees par des virgules.
    origines: ${MONCHEPTEL_CORS_ORIGINES:http://localhost:4200,https://admin.moncheptel.ml}

springdoc:
  # Ferme par defaut : le contrat complet de l'API n'a pas a etre publie en
  # production. Le profil dev le rouvre.
  api-docs:
    enabled: ${MONCHEPTEL_SWAGGER:false}
  swagger-ui:
    enabled: ${MONCHEPTEL_SWAGGER:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    ml.moncheptel: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        # Seule la sonde de sante est exposee. `*` publierait la
        # configuration, les variables d'environnement et les metriques —
        # c'est-a-dire la carte interne de l'application.
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # DESACTIVE VOLONTAIREMENT, et ce n'est pas un contournement.
      #
      # `spring.mail.host` vaut smtp.gmail.com par defaut, donc Spring Boot
      # fabrique un JavaMailSender, donc il auto-configure MailHealthIndicator.
      # Celui-ci ouvre une VRAIE connexion SMTP a chaque appel de la sonde. Avec
      # des identifiants vides — le cas voulu en developpement — elle echoue, et
      # l'indicateur passe DOWN. Comme la sante globale est le minimum de ses
      # indicateurs, /actuator/health rendait 503 : l'application entiere
      # declaree hors service parce qu'un envoi de courriel OPTIONNEL, dote d'un
      # repli documente vers la console, n'etait pas configure.
      #
      # Mesure du 4 octobre : 503 avec l'application parfaitement fonctionnelle.
      # En production ce defaut serait pire qu'un desagrement — un repartiteur
      # de charge ou une sonde Kubernetes auraient retire l'instance du service.
      #
      # Une sonde de disponibilite doit repondre a une seule question : « cette
      # instance peut-elle traiter des requetes ». La base de donnees en fait
      # partie, et son indicateur reste actif. Le courriel, non : son
      # indisponibilite est prevue et geree.
      enabled: false
