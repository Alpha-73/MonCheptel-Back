# Profil des tests : base H2 en memoire, recreee a chaque lancement.
#
# H2 en mode MySQL : la compatibilite n'est pas totale, mais elle couvre le
# JPQL du projet. C'est ce qui permet aux tests de valider les 21 requetes
# `@Query` au demarrage du contexte Spring — une faute de frappe dans l'une
# d'elles fait echouer le test, pas le deploiement.

spring:
  datasource:
    url: jdbc:h2:mem:moncheptel;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    # Desactive en test : les migrations sont ecrites pour MySQL (moteur
    # InnoDB, LONGTEXT, accents graves autour de `precision`). C'est
    # Hibernate qui cree le schema de test a partir des entites.
    #
    # Consequence assumee : les tests ne verifient PAS les migrations. Le
    # controle des migrations se fait contre une vraie base MySQL, pas ici :
    # voir MigrationsMariaDbTest (base jetable, ignore sans serveur).
    enabled: false

moncheptel:
  securite:
    secret-jwt: secret-de-test-uniquement-trente-deux-octets-minimum
    tentatives-avant-verrouillage: 5
    duree-verrouillage-minutes: 15
